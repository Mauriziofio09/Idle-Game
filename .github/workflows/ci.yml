# Verification on every push and pull request. Deployment is a separate workflow, so a
# red test can never reach the published page.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      # Colour contrast against WCAG AA, computed from tokens.css itself.
      - name: Contrast
        run: npm run contrast

      - name: Build
        run: npm run build

      # The balancing targets of the design document, over a reduced number of seeds so
      # the job stays quick. `npm run sim` uses 200 locally.
      - name: Balancing simulation
        run: SIM_SEEDS=40 npm run sim

      - name: Install the browser for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run e2e

      # Both directories: the HTML report to read, and the traces beside it to step
      # through. Without the reporter and trace settings in playwright.config.ts this step
      # used to upload nothing at all and warn about it.
      - name: Keep the evidence when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
