<main>
  <header>
    <app-icon-box size="sm" class="accent">
      <app-icon name="archive" />
    </app-icon-box>
    <div class="titles">
      <h1 #pageTitle tabindex="-1">{{ content.title }}</h1>
      <p class="subtitle">{{ content.subtitle }} · {{ content.archivePrefix }}{{ seed() }}</p>
    </div>
  </header>

  <app-card class="bar">
    <app-resource-bar />
  </app-card>

  @if (startupNotice(); as notice) {
    <app-card class="notice" role="status">
      <h2>{{ notice.title }}</h2>
      <p class="summary">{{ notice.text }}</p>
      <button type="button" class="dismiss" (click)="dismissNotice()">
        {{ noticeDismiss }}
      </button>
    </app-card>
  }

  @if (awayReport(); as report) {
    <app-card class="away">
      <app-return-summary [report]="report" (dismissed)="dismissReport()" />
    </app-card>
  }

  @if (ended()) {
    <app-card class="ending">
      <app-chronicle (restarted)="onRestarted()" />
    </app-card>
  }

  <div class="stage">
    <app-card class="section">
      <app-cross-section />
    </app-card>

    <div class="panels">
      <app-card [label]="titles.detail">
        <app-detail-panel />
      </app-card>

      <app-card [label]="protocolLabels.title">
        <app-protocols />
      </app-card>

      <app-card [label]="titles.log">
        <app-archive-log />
      </app-card>

      <app-card [label]="legacyLabels.title">
        <app-legacy />
      </app-card>

      <app-card [label]="scenarioLabels.title">
        <app-scenarios />
      </app-card>

      <app-card [label]="settingsLabels.title">
        <app-settings />
      </app-card>
    </div>
  </div>
</main>
