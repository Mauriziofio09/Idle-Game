<main>
  <header>
    <app-icon-box size="sm" class="accent">
      <app-icon name="archive" />
    </app-icon-box>
    <div class="titles">
      <h1>{{ content.title }}</h1>
      <p class="subtitle">{{ content.subtitle }} · {{ content.archivePrefix }}{{ seed() }}</p>
    </div>
  </header>

  <app-card class="bar">
    <app-resource-bar />
  </app-card>

  @if (endReason(); as reason) {
    <app-card class="ending">
      <h2>{{ reason }}</h2>
      <p class="summary">
        {{ endLabels.runtime }} {{ runtime() }} · {{ endLabels.saved }} {{ saved() }}
      </p>
    </app-card>
  }

  <div class="stage">
    <app-card class="section">
      <app-cross-section />
    </app-card>

    <div class="panels">
      <app-card [label]="titles.detail">
        <app-detail-panel />
      </app-card>

      <app-card [label]="titles.log">
        <app-archive-log />
      </app-card>
    </div>
  </div>
</main>
